# Everything that changes results lives here. The run manifest stores a hash of
# this file, so two runs with the same hash used the same settings.

source:
  repo: openstax/osbooks-anatomy-physiology
  commit: 5ae32b3f4bc24ed003e91dc38bf47dba80751044   # main on 2026-09-08
  collection: collections/anatomy-and-physiology-2e.collection.xml
  book_slug: anatomy-and-physiology-2e
  license: CC BY-NC-SA 4.0
  chapters:
    - number: 19
      title: "The Cardiovascular System: The Heart"
    - number: 22
      title: "The Respiratory System"
  # Feature boxes worth keeping. "interactive" boxes are just video links.
  keep_note_classes: [disorders, diseases, everyday, aging, homeostatic]

chunking:
  target_words: 220
  max_words: 320
  min_words: 70

embedding:
  model: BAAI/bge-small-en-v1.5
  query_prefix: "Represent this sentence for searching relevant passages: "
  device: cuda
  batch_size: 64

generator:
  model: qwen2.5:7b-instruct-q4_K_M
  prompt: generate_v1
  temperature: 0.7
  seed: 7
  num_ctx: 4096
  num_gpu: 99            # every layer on the GPU (Ollama's default split left ~20% on the CPU)
  questions_per_chunk: 1

judge:
  # Different model family from the generator, so the judge is not grading its own style.
  model: llama3.1:8b-instruct-q4_K_M
  temperature: 0.0
  seed: 11
  num_ctx: 4096
  num_gpu: 99

self_judge:
  # The generator grading its own questions, to measure self-preference.
  model: qwen2.5:7b-instruct-q4_K_M
  temperature: 0.0
  seed: 11
  num_ctx: 4096
  num_gpu: 99

nli:
  model: cross-encoder/nli-deberta-v3-base
  device: cuda
  entail_threshold: 0.5
  window_sentences: 2     # premises are every 1- and 2-sentence span of the passage

checks:
  # rapidfuzz partial_ratio, 0-100. Calibrated on gen-v1: real quotes, including lightly
  # edited ones, scored 80 or more; the same quotes against an unrelated passage never
  # passed 55.
  quote_match_threshold: 75
  duplicate_cosine: 0.92
  retrieval_top_k: 3
  length_cue_ratio: 1.6
  # A question auto-passes only if every hard check passes.
  # Soft checks are recorded and compared against human review, but do not block.
  hard:
    - options_distinct
    - no_all_none_of_above
    - stem_leak
    - evidence_in_source
    - duplicate
    - judge_blind_solve
    - judge_answer_grounded
    - judge_single_correct
    - judge_distractor_quality
  soft:
    - text_reference
    - negative_stem
    - absolute_terms
    - length_cue
    - statement_consistent
    - numeric_grounding
    - key_terms_in_source
    - citation_retrieval
    - book_overlap
    - nli_answer_entailed
    - nli_distractors_not_entailed
    - judge_stem_clear

images:
  # Figures from these chapters train the LoRA (heart, vessels, lungs).
  chapters:
    - number: 19
      title: "The Cardiovascular System: The Heart"
    - number: 20
      title: "The Cardiovascular System: Blood Vessels and Circulation"
    - number: 22
      title: "The Respiratory System"
  # Photos and micrographs credited to third parties can carry other rights; only
  # OpenStax's own drawn illustrations are used.
  exclude_caption_patterns: ["©", "credit:", "micrograph", "Micrograph", "photo", "Photo", "LM ×", "EM ×"]
  # Charts, tables, graphs and photos would teach the LoRA boxes and fake text; only
  # anatomical drawings are kept. Matched case-insensitively against title and alt text.
  exclude_alt_patterns: [flowchart, flow chart, chart, table, graph, photo, canister, ECG, electrocardiogram, millivolts, lists the]
  base_model: stable-diffusion-v1-5/stable-diffusion-v1-5
  resolution: 512
  steps: 25
  guidance: 7.0
  seeds: [11, 22, 33, 44]
  trigger: "osxillus"
  lora:
    rank: 8
    alpha: 8
    learning_rate: 0.0001
    steps: 1200
    seed: 5
  stamp: "SYNTHETIC EDUCATIONAL IMAGE - NOT A REAL PATIENT"
  vlm: qwen2.5vl:3b
  clip_model: laion/CLIP-ViT-B-32-laion2B-s34B-b79K   # ships safetensors; torch 2.5 cannot load .bin

ollama_url: http://localhost:11434

# The generation run that the report and the release are about.
primary_run: gen-v1

paths:
  data: data
  runs: runs
  reports: reports
  releases: releases
  database: sqlite:///data/medquiz.db

cost:
  # Used only to turn measured GPU energy into money. Indian residential tariff, roughly.
  electricity_inr_per_kwh: 8.0
