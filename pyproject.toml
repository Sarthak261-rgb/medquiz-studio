[project]
name = "medquiz"
version = "0.1.0"
description = "Grounded anatomy MCQ generation with automatic checks and a human review loop"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Sarthak Tripathi" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.38",
    "typer>=0.12",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# Heavy pieces only needed to run the pipeline (embeddings, NLI, GPU energy).
# The API, review app and tests run without them.
ml = [
    "torch==2.5.1",
    "sentence-transformers>=3.0,<5.2",
    "transformers>=4.44,<5",
    "faiss-cpu>=1.8",
    "nvidia-ml-py>=12.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
medquiz = "medquiz.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medquiz"]

# CUDA wheels for Windows/Linux; CI and Docker never install the ml extra.
[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# the formatter owns line length; the few long lines left are report strings
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`:DeprecationWarning"]
